version: '3.8'

services:
  hiv-dadr-cardiovascular-risk:
    build: .
    container_name: hiv-dadr-cardiovascular-risk
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=hiv-dadr-cardiovascular-risk-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
