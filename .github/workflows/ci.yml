name: Python CI and security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check installed dependency compatibility
        run: python -m pip check
      - name: Compile Python modules
        run: python -m compileall -q agents cli.py dad_hiv_risk.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Check browser JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("web/index.html").read_text(encoding="utf-8")
          assert text.count("<script>") == text.count("</script>") == 1
          js = text.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/dad-page.js").write_text(js, encoding="utf-8")
          PY
          node --check /tmp/dad-page.js
